[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "icsmtl"
version = "0.1.0"
description = "A collection of scrapers that convert common web sources into .ics files"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4",
    "lxml",
    "pyxdg",
    "requests",
]

[project.scripts]
cultmtl = "icsmtl.cultmtl:main"
mtlrave-telegram = "icsmtl.mtlrave_telegram:main"
